name: V2Ray Service

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Duration to keep alive (e.g. 6h)'
        required: false
        default: '6h'

jobs:
  run-v2ray:
    runs-on: ubuntu-latest
    steps:
      - name: Setup V2Ray and Generate Configs
        run: |
          mkdir -p v2ray
          UUID=$(cat /proc/sys/kernel/random/uuid)
          IP=$(curl -s https://api.ipify.org || echo "127.0.0.1")

          openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
            -keyout v2ray/key.pem -out v2ray/cert.pem \
            -subj "/CN=$IP"

          cat <<EOF > v2ray/config.json
          {
            "log": { "loglevel": "warning" },
            "inbounds": [
              {
                "port": 8080,
                "protocol": "vless",
                "settings": { "clients": [{ "id": "$UUID" }], "decryption": "none" },
                "streamSettings": { "network": "ws", "wsSettings": { "path": "/ws" } }
              },
              {
                "port": 8443,
                "protocol": "vless",
                "settings": { "clients": [{ "id": "$UUID" }], "decryption": "none" },
                "streamSettings": {
                  "network": "ws",
                  "security": "tls",
                  "tlsSettings": { "certificates": [{ "certificateFile": "/etc/v2ray/cert.pem", "keyFile": "/etc/v2ray/key.pem" }] },
                  "wsSettings": { "path": "/ws-tls" }
                }
              },
              {
                "port": 8000,
                "protocol": "vless",
                "settings": { "clients": [{ "id": "$UUID" }], "decryption": "none" },
                "streamSettings": { "network": "tcp" }
              },
              {
                "port": 9443,
                "protocol": "vless",
                "settings": { "clients": [{ "id": "$UUID" }], "decryption": "none" },
                "streamSettings": {
                  "network": "tcp",
                  "security": "tls",
                  "tlsSettings": { "certificates": [{ "certificateFile": "/etc/v2ray/cert.pem", "keyFile": "/etc/v2ray/key.pem" }] }
                }
              }
            ],
            "outbounds": [{ "protocol": "freedom" }]
          }
          EOF

          docker run -d --name v2ray --network host \
            -v $(pwd)/v2ray:/etc/v2ray \
            v2fly/v2fly-core run -c /etc/v2ray/config.json

          echo "==================== V2RAY CONFIGS ===================="
          echo "UUID: $UUID"
          echo "Server IP: $IP"
          echo ""
          echo "1. VLESS + WS:"
          echo "vless://$UUID@$IP:8080?type=ws&security=none&path=%2Fws#VLESS-WS"
          echo ""
          echo "2. VLESS + WS + TLS:"
          echo "vless://$UUID@$IP:8443?type=ws&security=tls&sni=$IP&path=%2Fws-tls&allowInsecure=1#VLESS-WS-TLS"
          echo ""
          echo "3. VLESS + TCP:"
          echo "vless://$UUID@$IP:8000?type=tcp&security=none#VLESS-TCP"
          echo ""
          echo "4. VLESS + TCP + TLS:"
          echo "vless://$UUID@$IP:9443?type=tcp&security=tls&sni=$IP&allowInsecure=1#VLESS-TCP-TLS"
          echo "========================================================"

      - name: Keep Alive
        run: sleep ${{ github.event.inputs.duration || '6h' }}
